<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miau Links · encurtador de links</title>
  <meta name="description" content="Cole um link grande e o gatinho devolve um curtinho.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐱%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cardboard: #d8b184;
      --cardboard-dark: #a9784a;
      --ink: #2b2118;
      --paper: #fff8ec;
      --yarn: #12605f;
      --yarn-hover: #0d4a49;
      --error: #a3261f;
      --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
      --body: "Nunito", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cardboard);
      background-image: repeating-linear-gradient(90deg, transparent 0 46px, rgba(43,33,24,.05) 46px 48px);
      color: var(--ink);
      font-family: var(--body);
      font-weight: 500;
      line-height: 1.5;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    main { width: 100%; max-width: 30rem; }

    h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(2.4rem, 9vw, 3.4rem);
      line-height: 1;
      margin: 0 0 .5rem;
      text-align: center;
    }
    .lead { text-align: center; margin: 0 0 1.5rem; font-size: 1.05rem; }

    /* Gato espiando por cima da caixa */
    .cat { display: block; width: 11rem; margin: 0 auto -3px; position: relative; z-index: 0; }
    .cat .eye { transform-origin: center; transform-box: fill-box; animation: blink .5s 1.2s 1; }
    @keyframes blink { 50% { transform: scaleY(.1); } }

    .box {
      position: relative;
      z-index: 1;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 6px 6px 14px 14px;
      box-shadow: 0 8px 0 var(--cardboard-dark);
      padding: 1.5rem 1.25rem 1.25rem;
    }
    label { display: block; font-weight: 800; margin-bottom: .3rem; }
    .hint { font-weight: 500; font-size: .9rem; opacity: .8; }
    input[type="text"] {
      width: 100%;
      font: inherit;
      padding: .7rem .8rem;
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }
    .field { margin-bottom: 1rem; }
    .alias-row { display: flex; align-items: center; gap: .4rem; }
    .alias-row span { font-weight: 700; white-space: nowrap; font-size: .95rem; }

    button {
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: .75rem 1rem;
    }
    .primary { width: 100%; background: var(--yarn); color: #fff; box-shadow: 0 4px 0 var(--ink); }
    .primary:hover { background: var(--yarn-hover); }
    .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .primary[disabled] { opacity: .6; cursor: wait; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 4px solid #ffb703; outline-offset: 2px; }

    .error { color: var(--error); font-weight: 700; margin: .9rem 0 0; }
    .result { margin-top: 1.1rem; padding-top: 1rem; border-top: 3px dashed var(--cardboard-dark); }
    .result p { margin: 0 0 .5rem; font-weight: 800; }
    .short { display: flex; gap: .5rem; }
    .short a {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: .6rem .7rem;
      color: var(--yarn);
      font-weight: 800;
      text-decoration: none;
    }
    .copy { background: #ffd166; padding: .6rem .9rem; }
    .copy:hover { background: #ffc43d; }

    footer { text-align: center; margin-top: 1.6rem; font-size: .9rem; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .cat .eye { animation: none; } .primary:active { transform: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Miau Links</h1>
    <p class="lead">Cole um link comprido e o gatinho devolve um curtinho.</p>

    <svg class="cat" viewBox="0 0 220 100" role="img" aria-label="Um gatinho laranja espiando pela caixa">
      <polygon points="38,62 46,8 88,42" fill="#e8892b" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="182,62 174,8 132,42" fill="#e8892b" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="48,50 52,24 70,42" fill="#f4b6a6"/>
      <polygon points="172,50 168,24 150,42" fill="#f4b6a6"/>
      <ellipse cx="110" cy="85" rx="82" ry="52" fill="#e8892b" stroke="#2b2118" stroke-width="5"/>
      <path d="M92 36 q4 14 0 22 M110 32 v26 M128 36 q-4 14 0 22" stroke="#b85f12" stroke-width="5" stroke-linecap="round" fill="none"/>
      <g class="eye"><ellipse cx="78" cy="78" rx="11" ry="13" fill="#fff"/><ellipse cx="80" cy="80" rx="5" ry="9" fill="#2b2118"/></g>
      <g class="eye"><ellipse cx="142" cy="78" rx="11" ry="13" fill="#fff"/><ellipse cx="140" cy="80" rx="5" ry="9" fill="#2b2118"/></g>
    </svg>

    <div class="box">
      <form id="form" novalidate>
        <div class="field">
          <label for="url">Link para encurtar</label>
          <input id="url" name="url" type="text" inputmode="url" autocomplete="off" placeholder="https://site.com/um-endereco-bem-grande" required>
        </div>
        <div class="field">
          <label for="alias">Apelido <span class="hint">(opcional)</span></label>
          <div class="alias-row">
            <span id="origin">/c/</span>
            <input id="alias" name="alias" type="text" autocomplete="off" placeholder="gato-preto" aria-describedby="alias-help">
          </div>
          <span class="hint" id="alias-help">De 3 a 24 letras, números ou hífen.</span>
        </div>
        <button class="primary" type="submit" id="submit">Encurtar link</button>
      </form>

      <p class="error" id="error" role="alert" hidden></p>

      <section class="result" id="result" aria-live="polite" hidden>
        <p>Pronto! Seu link curtinho:</p>
        <div class="short">
          <a id="short" href="#" target="_blank" rel="noopener"></a>
          <button class="copy" type="button" id="copy">Copiar link</button>
        </div>
      </section>
    </div>

    <footer>Feito com carinho (e pelos de gato) para a aula de Documentação de Software.</footer>
  </main>

  <script>
    const form = document.getElementById("form");
    const urlInput = document.getElementById("url");
    const aliasInput = document.getElementById("alias");
    const submit = document.getElementById("submit");
    const errorBox = document.getElementById("error");
    const result = document.getElementById("result");
    const shortLink = document.getElementById("short");
    const copyBtn = document.getElementById("copy");

    document.getElementById("origin").textContent = location.host + "/c/";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      result.hidden = true;
      submit.disabled = true;
      submit.textContent = "Procurando a caixa…";

      try {
        const response = await fetch("/api/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: urlInput.value, alias: aliasInput.value }),
        });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Algo deu errado. Tente de novo.");

        shortLink.textContent = data.shortUrl;
        shortLink.href = data.shortUrl;
        copyBtn.textContent = "Copiar link";
        result.hidden = false;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        submit.disabled = false;
        submit.textContent = "Encurtar link";
      }
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(shortLink.textContent);
        copyBtn.textContent = "Copiado!";
      } catch {
        copyBtn.textContent = "Selecione e copie";
      }
    });
  </script>
</body>
</html>
